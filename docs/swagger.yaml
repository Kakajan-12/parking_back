  /api/v1/camera/{id}/update/:
    patch:
      consumes:
      - application/json
      description: Updates an existing camera
      parameters:
      - description: Camera ID (int)
        in: path
        name: id
        required: true
        type: integer
      - description: Request data
        in: body
        name: requestBody
        required: true
        schema:
          $ref: '#/definitions/CameraUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: Bad Request
          schema:
            $ref: '#/definitions/CameraMessageResponse'
        "400":
          description: 'detail: BadRequest - invalid request'
          schema:
            $ref: '#/definitions/BadRequestResponse'
        "401":
          description: 'detail: Unauthorized - Invalid token'
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "403":
          description: 'detail: Permission denied'
          schema:
            $ref: '#/definitions/PermissionDeniedResponse'
        "404":
          description: 'detail: User not found'
          schema:
            $ref: '#/definitions/NotFoundResponse'
        "422":
          description: 'detail: Validation errors'
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "500":
          description: 'detail: Internal Server Error'
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      security:
      - OAuth2Password:
        - ""
      summary: Update a camera
      tags:
      - Cameras
  /api/v1/camera/count/:
    get:
      consumes:
      - application/json
      description: Retrieves a count of cameras
      parameters:
      - description: Search term
        in: query
        name: search
        type: string
      - description: Camera type
        enum:
        - inside
        - outside
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'count: 12345'
          schema:
            $ref: '#/definitions/CountResponse'
        "401":
          description: 'detail: Unauthorized - Invalid token'
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "403":
          description: 'detail: Permission denied'
          schema:
            $ref: '#/definitions/PermissionDeniedResponse'
        "500":
          description: 'detail: Internal Server Error'
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      security:
      - OAuth2Password:
        - ""
      summary: Count returns total cameras count
      tags:
      - Cameras
  /api/v1/camera/create/:
    post:
      consumes:
      - application/json
      description: Creates new camera
      parameters:
      - description: Request body
        in: body
        name: requestBody
        required: true
        schema:
          $ref: '#/definitions/CameraCreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CameraMessageResponse'
        "401":
          description: 'detail: Unauthorized - Invalid token'
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "403":
          description: 'detail: Permission denied'
          schema:
            $ref: '#/definitions/PermissionDeniedResponse'
        "422":
          description: 'detail: Validation errors'
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "500":
          description: 'detail: Internal Server Error'
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      security:
      - OAuth2Password:
        - ""
      summary: Creates a new camera
      tags:
      - Cameras
  /api/v1/car-session/:
    get:
